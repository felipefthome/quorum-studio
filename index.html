<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUORUM STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --deep:#06140F; --emerald:#0D3326; --gold:#C8A35A; --gold-l:#E9D3A0; --champ:#EAD9B5;
  --bg:#ECE8E0; --panel:#FAF8F4; --line:#E1DBCF; --ink:#16201B; --muted:#76726A;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:Montserrat,"Helvetica Neue",Arial,sans-serif; --cinzel:Cinzel,"Cormorant Garamond",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 20px;background:linear-gradient(100deg,var(--deep),var(--emerald));color:#F4EEDF;border-bottom:1px solid var(--gold)}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:var(--cinzel);font-weight:500;font-size:22px;letter-spacing:.18em;background:linear-gradient(90deg,#B8924A,#F0DCA6,#B8924A);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:10px;letter-spacing:.34em;color:#CDBB93;font-weight:600}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid rgba(232,211,160,.35);background:transparent;color:#F1E8D4;padding:9px 14px;border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.15s}
.btn:hover{background:rgba(232,211,160,.1)}
.btn.solid{background:linear-gradient(100deg,#A9843F,#E3C88C 50%,#B48D45);border-color:transparent;color:#1E1A0E}
.btn.solid:hover{filter:brightness(1.06)}
.btn.light{color:var(--emerald);border-color:var(--line);background:#fff}
.btn.light:hover{border-color:var(--gold)}
.btn.ghost{color:var(--emerald);border-color:transparent;background:transparent;padding:6px 8px}
.main{flex:1;display:grid;grid-template-columns:minmax(360px,450px) 1fr;min-height:0}
.editor{border-right:1px solid var(--line);background:var(--panel);overflow:auto;height:calc(100vh - 62px);padding:18px 18px 60px}
.previewWrap{height:calc(100vh - 62px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;min-width:0;background:radial-gradient(ellipse at 50% 40%,#22352D 0%,#121C18 70%)}
.stage{position:relative;width:min(100%,calc((100vh - 250px) * var(--arn)));aspect-ratio:var(--ar);box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 1px rgba(200,163,90,.25)}
.stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas.dragging{cursor:grabbing}
.pvInfo{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;color:#B9AE96;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.pvInfo .dot{width:4px;height:4px;transform:rotate(45deg);background:var(--gold)}
.warn{color:#F0B58C}
.sec{background:#fff;border:1px solid var(--line);border-radius:3px;margin-bottom:14px}
.secH{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
.secH .n{font-family:var(--cinzel);font-size:17px;color:var(--gold);width:20px}
.secH h3{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--emerald)}
.secH .chev{margin-left:auto;color:var(--muted);transition:.2s}
.secB{padding:4px 16px 16px}
.lbl{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;border:1px solid var(--line);background:var(--panel);padding:10px 11px;border-radius:2px;outline:none;transition:.15s}
.inp:focus{border-color:var(--gold);background:#fff}
textarea.inp{resize:vertical;min-height:62px;font-family:var(--serif);font-size:19px;line-height:1.2}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row5{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:6px}
.row5 .lbl{font-size:9px;letter-spacing:.08em}
.hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:9px 6px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--emerald);color:#F1E6CC}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.06em;cursor:pointer;color:var(--emerald)}
.chip.on,.chip:hover{border-color:var(--gold);background:#FBF5E8}
.tgl{margin-left:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:10px;letter-spacing:.1em}
.tgl input{accent-color:var(--gold);width:16px;height:16px}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl{border:1px solid var(--line);background:#fff;border-radius:2px;padding:8px;cursor:pointer;text-align:left;transition:.15s}
.tpl.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tpl .mini{aspect-ratio:4/5;background:radial-gradient(ellipse at 50% 80%,#164433,#06140F);margin-bottom:8px;position:relative;overflow:hidden}
.tpl b{display:block;font-size:10px;letter-spacing:.14em;color:var(--emerald)}
.tpl small{font-size:10px;color:var(--muted)}
.drop{display:block;border:1px dashed #CDBB93;background:var(--panel);border-radius:2px;padding:16px;text-align:center;cursor:pointer;color:var(--muted);font-size:12px;transition:.15s}
.drop:hover,.drop.over{border-color:var(--gold);background:#fff;color:var(--emerald)}
.drop b{display:block;color:var(--emerald);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.photos{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ph{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px;border-radius:2px;background:#fff;cursor:pointer}
.ph.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.ph img{width:64px;height:48px;object-fit:cover;display:block}
.ph .meta{flex:1;min-width:0}
.ph .meta div{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.14em;padding:3px 6px;background:var(--emerald);color:#EBD9AE;margin-top:3px}
.tag.alt{background:#F1EDE4;color:var(--muted)}
.ib{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--emerald);font-size:13px;flex:none}
.ib:hover{border-color:var(--gold)}
.ib:disabled{opacity:.3;cursor:default}
.frame{margin-top:12px;padding:12px;background:var(--panel);border:1px solid var(--line)}
.rng{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;gap:8px;margin:6px 0;font-size:11px;color:var(--muted)}
.rng input{width:100%;accent-color:var(--gold)}
.logoBox{display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--line);padding:14px;background:radial-gradient(ellipse at 30% 40%,#164433,#06140F);min-height:96px}
.logoBox.plate{background:linear-gradient(135deg,#F5EEDD,#E4D3AE)}
.logoBox img{max-height:76px;max-width:220px;display:block}
.logoBox span{color:#CDBB93;font-size:11px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 8px;background:#fff;border-radius:2px}
.swc input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer}
.swc span{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.ext{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.extc{display:flex;flex-direction:column;align-items:center;gap:4px}
.extc i{width:34px;height:34px;display:block;border:1px solid rgba(0,0,0,.08)}
.extc div{display:flex;gap:2px}
.extc button{font-size:9px;border:1px solid var(--line);background:#fff;padding:2px 4px;cursor:pointer;font-weight:700}
.icons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.icons button{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:2px;cursor:pointer;padding:5px}
.icons button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);background:#0F2E23}
.icons canvas{width:100%;height:100%;display:block}
.status{font-size:11px;color:var(--muted);margin-top:8px}
.ok{color:#2E6B46}
.modalBg{position:fixed;inset:0;background:rgba(6,14,11,.78);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);max-width:min(560px,100%);width:100%;max-height:100%;overflow:auto;border-top:2px solid var(--gold);padding:20px}
.modal h4{margin:0 0 4px;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--emerald)}
.modal p{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.5}
.modal img.out{width:100%;display:block;box-shadow:0 6px 20px rgba(0,0,0,.18);margin-bottom:14px}
.mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep);color:#F1E8D4;padding:12px 18px;font-size:12px;z-index:60;border-left:2px solid var(--gold);max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.strip{display:flex;align-items:center;gap:8px;max-width:100%}
.strip .ar{width:34px;height:34px;border:1px solid rgba(200,163,90,.4);background:transparent;color:#E9D3A0;border-radius:50%;cursor:pointer;flex:none;font-size:16px}
.strip .ar:disabled{opacity:.3}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:thin}
.thumb{flex:none;width:58px;border:1px solid rgba(200,163,90,.25);background:#0B1E17;padding:0;cursor:pointer;position:relative;color:#CDBB93;font-size:10px}
.thumb.on{border-color:#E9D3A0;box-shadow:0 0 0 1px #E9D3A0}
.thumb img{width:100%;display:block}
.thumb span{position:absolute;left:3px;top:2px;font-weight:700;text-shadow:0 1px 3px #000}
.thumb .ph0{display:flex;align-items:center;justify-content:center}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0;cursor:pointer}
.chk input{accent-color:var(--gold);width:16px;height:16px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.gal figure{margin:0}
.gal img{width:100%;display:block;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.gal figcaption{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.08em}
.gal figcaption button{font-size:9px;border:1px solid var(--line);background:#fff;padding:3px 6px;cursor:pointer;font-weight:700;letter-spacing:.08em}
.snav{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;justify-content:space-between}
.snav button.big{flex:none;min-width:96px;height:42px;border:1px solid rgba(232,211,160,.5);background:rgba(232,211,160,.08);color:#F1E6CC;border-radius:2px;font-size:11px;font-weight:700;letter-spacing:.14em;cursor:pointer}
.snav button.big:disabled{opacity:.3;cursor:default}
.snav .mid{display:flex;flex-direction:column;align-items:center;gap:6px;color:#E9D3A0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;transform:rotate(45deg);background:rgba(232,211,160,.3);cursor:pointer}
.dots i.on{background:#E9D3A0}
.libbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.libcur{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);background:linear-gradient(100deg,#0B261C,#123B2D);color:#EBDDBB;font-size:11px;letter-spacing:.06em}
.libcur b{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:0;color:#F7EEDA;display:block}
.libcur small{color:#CDBB93;letter-spacing:.12em;text-transform:uppercase;font-size:9px;font-weight:700}
.modal.wide{max-width:min(880px,100%)}
.ltabs{display:flex;border-bottom:1px solid var(--line);margin:6px 0 12px}
.ltabs button{border:0;background:none;padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.ltabs button.on{color:var(--emerald);border-color:var(--gold)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lcard{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
.lcard .th{aspect-ratio:4/3;background:radial-gradient(ellipse at 50% 70%,#164433,#06140F);background-size:cover;background-position:center;position:relative}
.lcard .th em{position:absolute;left:8px;bottom:8px;font-style:normal;font-size:9px;font-weight:700;letter-spacing:.14em;background:rgba(6,20,15,.8);color:#EBD9AE;padding:3px 6px}
.lcard .bd{padding:10px;flex:1}
.lcard .bd b{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--emerald);display:block;line-height:1.1}
.lcard .bd span{font-size:11px;color:var(--muted);display:block;margin-top:4px}
.lcard .ac{display:flex;gap:4px;padding:0 10px 10px;flex-wrap:wrap}
.lcard .ac button{font-size:9.5px;font-weight:700;letter-spacing:.1em;border:1px solid var(--line);background:#fff;padding:6px 8px;cursor:pointer;color:var(--emerald)}
.lcard .ac button.pri{background:var(--emerald);color:#F1E6CC;border-color:var(--emerald)}
.lcard .ac button.del{color:#9A3B2B;margin-left:auto}
.bph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.bph div{border:1px solid var(--line);background:#fff;padding:4px;position:relative}
.bph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.bph input{width:100%;border:1px solid var(--line);font-size:11px;padding:5px;margin-top:4px}
.bph button{position:absolute;top:6px;right:6px;width:24px;height:24px;border:0;background:rgba(6,20,15,.8);color:#fff;cursor:pointer}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line)}
.mtabs{display:none}
@media (max-width:900px){
  .top{padding:10px 12px;flex-wrap:wrap;gap:8px}
  .actions{width:100%}
  .actions .btn{flex:1;padding:9px 4px;font-size:9.5px;letter-spacing:.06em}
  .mtabs{display:flex;position:sticky;top:0;z-index:15;background:var(--panel);border-bottom:1px solid var(--line)}
  .mtabs button{flex:1;border:0;background:none;padding:12px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
  .mtabs button.on{color:var(--emerald);border-color:var(--gold)}
  .main{grid-template-columns:1fr}
  .editor{height:auto;border-right:0;padding:14px 12px 40px}
  .previewWrap{height:auto;padding:16px 12px 40px}
  .stage{width:100%}
  .main.showEdit .previewWrap{display:none}
  .main.showPrev .editor{display:none}
  .row5{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const {useState,useEffect,useRef,useCallback,useMemo} = React;
const html = htm.bind(React.createElement);

/* ============ CONSTANTES ============ */
const FORMATS = { feed:{w:1080,h:1350,label:'Feed 4:5',ar:'4/5',arn:.8}, square:{w:1080,h:1080,label:'Quadrado 1:1',ar:'1/1',arn:1}, story:{w:1080,h:1920,label:'Stories 9:16',ar:'9/16',arn:.5625,safe:{top:220,bottom:330}} };
const NOSAFE={top:0,bottom:0};
const SPEC_NAMES={area:'ÁREA PRIVATIVA',bed:'DORMITÓRIOS',suite:'SUÍTES',bath:'BANHEIROS',car:'VAGAS DE GARAGEM'};
const CTAS=['AGENDE SUA VISITA','FALE COM UM CORRETOR','CONSULTE CONDIÇÕES'];
const TEMPLATES = [
  {id:'A',name:'Campanha',desc:'Foto integrada ao fundo'},
  {id:'B',name:'Editorial',desc:'Foto emoldurada em dourado'},
  {id:'C',name:'Galeria',desc:'Duas ou três fotos'}
];
const SERIF='"Cormorant Garamond", Georgia, serif';
const SANS='Montserrat, "Helvetica Neue", Arial, sans-serif';
const CINZEL='Cinzel, "Cormorant Garamond", Georgia, serif';
const NUMF=s=>`500 ${(s*.9).toFixed(1)}px ${CINZEL}`; // algarismos alinhados (lining) para números sempre legíveis
const DEFAULT_COLORS={deep:'#05120D',emerald:'#0D3326',gold:'#C8A35A',champagne:'#EAD9B5'};
const WARM_WHITE='#FAF4E8';
const EMPTY_INFO={headline:'',subtitle:'',bairro:'',cidade:'',preco:'',area:'',quartos:'',suites:'',banheiros:'',vagas:'',chamadaOn:true,chamada:'',feature:'',featureIcon:'estrela',cta:'',contato:''};
const CALLS=['PRONTO PARA MORAR','EXCLUSIVIDADE QUORUM','OPORTUNIDADE','LANÇAMENTO','ALTO PADRÃO'];
const FEATURES=[['Terraço com churrasqueira','churrasqueira'],['Sacada gourmet','sacada'],['Vista panorâmica','vista'],['Piscina privativa','piscina'],['Acabamento de alto padrão','diamante']];
const FEATURE_ICONS=[['estrela','Destaque'],['churrasqueira','Churrasqueira'],['sacada','Sacada'],['vista','Vista'],['piscina','Piscina'],['diamante','Alto padrão'],['chave','Chaves']];
const LS_BRAND='quorum-studio-brand-v2', LS_LOGO='quorum-studio-logo-v1', LS_DRAFT='quorum-studio-draft-v2';

const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ============ CORES ============ */
function rgb(hex){let h=(hex||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function hexA(hex,a){const[r,g,b]=rgb(hex);return `rgba(${r},${g},${b},${a})`}
function mix(a,b,t){const A=rgb(a),B=rgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function palette(c){return{...c,white:WARM_WHITE,goldL:mix(c.gold,'#FFF6DC',.55),goldD:mix(c.gold,'#2A1A05',.38),goldXL:mix(c.gold,'#FFFFFF',.72),ink:mix(c.deep,'#2A1C08',.5)}}
function goldGrad(ctx,x0,y0,x1,y1,P,a=1){const g=ctx.createLinearGradient(x0,y0,x1,y1);[[0,P.goldD],[.22,P.goldL],[.45,P.gold],[.62,P.goldXL],[.8,P.gold],[1,P.goldD]].forEach(([o,c])=>g.addColorStop(o,hexA(c,a)));return g}

/* ============ TEXTO ============ */
const up=s=>(s||'').toLocaleUpperCase('pt-BR');
function locationText(i){return [i.bairro,i.cidade].map(s=>(s||'').trim()).filter(Boolean).join('  ·  ')}
function priceText(i){if(!i.preco)return '';return 'R$ '+Number(i.preco).toLocaleString('pt-BR')}
function specsOf(i){
  const out=[];
  if(i.area&&i.area.replace(',','')!=='')out.push({icon:'area',value:i.area+' m²',label:'PRIVATIVOS'});
  const add=(v,ic,s,p)=>{if(v!==''&&v!=null){const n=parseInt(v,10);if(!isNaN(n))out.push({icon:ic,value:String(n),label:n===1?s:p})}};
  add(i.quartos,'bed','DORMITÓRIO','DORMITÓRIOS');add(i.suites,'suite','SUÍTE','SUÍTES');add(i.banheiros,'bath','BANHEIRO','BANHEIROS');add(i.vagas,'car','VAGA','VAGAS');

  const line=(t,w,l='50%',h=3,bg=gold,tr='translateX(-50%)')=>html`<div style=${{position:'absolute',top:t,left:l,width:w,height:h,background:bg,transform:tr}}></div>`;
  if(id==='A')return html`<div className="mini"><div style=${{position:'absolute',inset:'0 0 38% 0',background:ph,WebkitMaskImage:'linear-gradient(#000 60%,transparent)',maskImage:'linear-gradient(#000 60%,transparent)'}}></div>${line('66%','62%','50%',4,'#F3EBDB')}${line('74%','40%')}${line('80%','46%','50%',6)}${line('89%','70%','50%',2,'rgba(240,220,166,.6)')}</div>`;
  if(id==='B')return html`<div className="mini"><div style=${{position:'absolute',left:'12%',right:'12%',top:'20%',height:'40%',background:ph,outline:'1px solid #C8A35A',outlineOffset:2}}></div>${line('70%','52%','12%',4,'#F3EBDB','none')}${line('77%','34%','12%',3,gold,'none')}${line('84%','60%','12%',2,'rgba(240,220,166,.6)','none')}</div>`;
  return html`<div className="mini"><div style=${{position:'absolute',left:'10%',width:'46%',top:'20%',height:'44%',background:ph,outline:'1px solid #C8A35A'}}></div><div style=${{position:'absolute',left:'60%',right:'10%',top:'20%',height:'21%',background:ph,outline:'1px solid #C8A35A'}}></div><div style=${{position:'absolute',left:'60%',right:'10%',top:'43%',height:'21%',background:ph,outline:'1px solid #C8A35A'}}></div>${line('72%','60%','50%',4,'#F3EBDB')}${line('80%','40%')}${line('88%','66%','50%',2,'rgba(240,220,166,.6)')}</div>`;
}

  const makeMain=i=>setPhotos(p=>{const a=[...p];const [x]=a.splice(i,1);a.unshift(x);return a});
  const removePhoto=id=>{const rest=photos.filter(q=>q.id!==id);const x=photos.find(q=>q.id===id);if(x)URL.revokeObjectURL(x.url);setPhotos(rest);if(selId===id)setSelId(rest[0]?rest[0].id:null)};
  const setFrame=(id,patch)=>setPhotos(p=>p.map(q=>q.id===id?{...q,frame:{...q.frame,...patch}}:q));
  const reorderTo=(from,to)=>setPhotos(p=>{if(from===to||from==null)return p;const a=[...p];const [x]=a.splice(from,1);a.splice(to,0,x);return a});

  /* Arrastar na prévia */
  const toCanvas=e=>{const cv=canvasRef.current,r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  const onDown=e=>{const p=toCanvas(e);const lr=logoRef.current;if(lr&&p.x>=lr.x-12&&p.x<=lr.x+lr.w+12&&p.y>=lr.y-12&&p.y<=lr.y+lr.h+12){dragRef.current={logo:true,sx:p.x,sy:p.y,a:{...la}};setDragging(true);try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}return}if(splitRef.current&&state.slide.type==='cover'&&Math.abs(p.y-splitRef.current-(tpl==='A'?0:13))<26){dragRef.current={split:true};setDragging(true);try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}return}const s=[...slotsRef.current].reverse().find(s=>p.x>=s.x&&p.x<=s.x+s.w&&p.y>=s.y&&p.y<=s.y+s.h);if(!s)return;
    const ph=photos.find(q=>q.id===s.id);if(!ph)return;setSelId(s.id);dragRef.current={id:s.id,sx:p.x,sy:p.y,f:{...ph.frame},ox:s.ox,oy:s.oy};setDragging(true);try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}};
  const onMove=e=>{const d=dragRef.current;if(!d)return;const p=toCanvas(e);if(d.logo){const cl=(v,a,b)=>Math.max(a,Math.min(b,v));setLA({x:Math.round(cl(d.a.x+p.x-d.sx,-250,800)),y:Math.round(cl(d.a.y+p.y-d.sy,-150,1500))});return}if(d.split){const H=canvasRef.current.height;setSplit(Math.round(Math.max(.4,Math.min(.9,(p.y-(tpl==='A'?0:13))/H))*1000)/1000);return}const cl=v=>Math.max(-1,Math.min(1,v));
    setFrame(d.id,{x:Math.abs(d.ox)>1?cl(d.f.x-2*(p.x-d.sx)/d.ox):d.f.x,y:Math.abs(d.oy)>1?cl(d.f.y-2*(p.y-d.sy)/d.oy):d.f.y})};
  const onUp=()=>{dragRef.current=null;setDragging(false)};

  /* Logo e identidade */
  const onLogo=async file=>{
    if(!file)return;if(!/^image\//.test(file.type)){say('Envie a logo em PNG, SVG, JPG ou WEBP.');return}
    try{const l=await logoFromBlob(file);applyLogoP(l,4);setLogoMode(null);setKeyBg(null);setSaveState('');
      if(caps.assets){try{const a=await caps.assets.upload(file);setLogoAssetId(a.id)}catch(e){setLogoAssetId(null)}}
      if(file.size<2.5e6){const d=await blobToDataURL(file);if(!ls.set(LS_LOGO,d))ls.del(LS_LOGO)}
      say('Logo original carregada — aplicada sem nenhuma alteração. Salve a identidade para reutilizar.');
    }catch(e){say('Não foi possível ler a logo.')}
  };
  const saveBrand=async()=>{
    const b={colors2:colors,logoMode:logoMode||mode,logoAdjs,keyBg:useKey,tpl,fmt,logoAssetId:logoAssetId||null};
    ls.set(LS_BRAND,JSON.stringify({...b,colors}));setSaveState('saving');
    if(caps.db&&caps.uid){try{await caps.db.doc(`data/users/${caps.uid}/brand`).set({...b,updatedAt:new Date().toISOString()});setSaveState('cloud');say('Identidade salva na sua conta.');return}catch(e){}}
    setSaveState('local');say('Identidade salva neste navegador.');
  };

  /* Exportação */
  const validate=()=>{if(!photos.length){say('Adicione ao menos uma fotografia do imóvel.');setOpen(o=>({...o,f:true}));return false}if(!logo){say('Carregue a logo original em “Identidade da marca”.');setOpen(o=>({...o,b:true}));return false}return true};
  const renderExport=(sl=slides[sIdx])=>new Promise((res,rej)=>{const cv=document.createElement('canvas');renderArt(cv,fmt,{...base,slide:resolve(sl)},false);try{cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png')}catch(e){rej(e)}});
  const dims=`${FORMATS[fmt].w}x${FORMATS[fmt].h}`;
  const baseName=()=>['quorum',slug(info.subtitle)||slug(info.bairro)||'imovel',piece==='carousel'?'carrossel':{A:'campanha',B:'editorial',C:'galeria'}[tpl],fmt==='story'?'stories':dims].join('-');
  const fileName=(sl=slides[sIdx])=>baseName()+(piece==='carousel'?'-'+String(sl.index).padStart(2,'0'):'')+'.png';
  const saveFile=async(data,name)=>{
    if(STANDALONE){try{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return 'saved'}catch(e){return 'unavailable:navegador'}}
    let dl=caps.downloads;if(!dl){dl=await useCap('downloads');if(dl)caps.downloads=dl}
    if(!dl)return 'unavailable:sem-permissao';
    const once=async d=>{try{await dl.save({filename:name,data:d});return 'saved'}catch(e){const c=(e&&e.code)||'erro';console.warn('downloads.save',c,e&&e.message);return c==='declined'?'declined':'unavailable:'+c}};
    let r=await once(data);
    if(r==='unavailable:rate_limited'){await new Promise(z=>setTimeout(z,1600));r=await once(data)}
    if(r.startsWith('unavailable:')&&r!=='unavailable:rate_limited'&&data instanceof Blob){try{r=await once(await data.arrayBuffer())}catch(e){}}
    return r;
  };
  const renderAll=async()=>{const items=[];for(const sl of slides){const blob=await renderExport(sl);items.push({blob,url:URL.createObjectURL(blob),name:fileName(sl)})}return items};
  const generate=async()=>{if(!validate())return;setBusy('Gerando…');try{setModal({items:await renderAll()})}catch(e){say('Falha ao gerar a imagem.')}setBusy('')};
  const download=async item=>{
    if(!item){if(!validate())return;try{const blob=await renderExport();item={blob,name:fileName()}}catch(e){say('Falha ao gerar a imagem.');return}}
    const r=await saveFile(item.blob,item.name);if(r==='saved'){say('PNG em alta resolução salvo.');return}if(r==='declined')return;
    setModal({items:[{...item,url:item.url||URL.createObjectURL(item.blob)}],fallback:true,code:r.split(':')[1]||''});
  };
  const downloadAll=async(items)=>{
    if(!validate())return;setBusy('Preparando .zip…');
    try{items=items||await renderAll();
      if(window.JSZip){const z=new JSZip();items.forEach(it=>z.file(it.name,it.blob));const blob=await z.generateAsync({type:'blob',compression:'STORE'});
        const r=await saveFile(blob,baseName()+'.zip');setBusy('');if(r==='saved'){say(`Carrossel com ${items.length} imagens salvo (.zip).`);return}if(r==='declined')return;setModal({items,fallback:true,code:r.split(':')[1]||''});return}
      setBusy('');setModal({items,fallback:true});
    }catch(e){setBusy('');say('Falha ao gerar o carrossel.')}
  };
  const copyImg=async it=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':it.blob})]);say('Imagem copiada. Cole onde quiser (WhatsApp, e-mail, editor de imagens…).')}catch(e){say('Este navegador não permitiu copiar. Use “Salvar imagem” segurando o dedo ou com o botão direito sobre a imagem.')}};
  const cycleTpl=()=>{setTpl(t=>({A:'B',B:'C',C:'A'})[t]);setSlideIdx(0)};
  const doClear=()=>{photos.forEach(p=>URL.revokeObjectURL(p.url));setPhotos([]);setSelId(null);setSlideIdx(0);setInfo({...EMPTY_INFO});setCur({id:null,edificioId:'',nome:'',status:'disponivel'});setConfirmClear(false);say('Formulário limpo. A identidade da marca foi mantida.')};

  const sel=photos.find(p=>p.id===selId);
  const setI=(k,v)=>setInfo(s=>({...s,[k]:v}));
  const digits=(v,n)=>v.replace(/\D/g,'').slice(0,n);
  const priceDisplay=info.preco?Number(info.preco).toLocaleString('pt-BR'):'';
  const usedCount={A:1,B:1,C:3}[tpl];
  const F=FORMATS[fmt];
  const tog=k=>()=>setOpen(o=>({...o,[k]:!o[k]}));

  return html`<div className="app">
    <header className="top">
      <div className="brand"><b>QUORUM</b><span>STUDIO</span></div>
      <div className="actions">
        <button className="btn" onClick=${cycleTpl}>Trocar modelo</button>
        <button className="btn" onClick=${()=>setConfirmClear(true)}>Limpar formulário</button>
        <button className="btn" onClick=${generate}>${busy||'Gerar publicação'}</button>
        ${piece==='carousel'?html`<button className="btn" onClick=${()=>download()}>Baixar slide</button><button className="btn solid" onClick=${()=>downloadAll()}>Baixar tudo (.zip)</button>`:html`<button className="btn solid" onClick=${()=>download()}>Baixar PNG</button>`}
      </div>
    </header>
    <div className="mtabs"><button className=${mtab==='edit'?'on':''} onClick=${()=>setMtab('edit')}>Editar</button><button className=${mtab==='prev'?'on':''} onClick=${()=>setMtab('prev')}>Pré-visualizar</button></div>
    <main className=${'main '+(mtab==='edit'?'showEdit':'showPrev')}>
      <aside className="editor">
        <${Section} n="◆" title="Biblioteca de imóveis" open=${open.lib} onToggle=${tog('lib')}>
          <div className="libcur"><div style=${{flex:1,minWidth:0}}><small>${cur.id?'Imóvel salvo · editando':'Imóvel novo · ainda não salvo'}</small><b style=${{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${(cur.nome||'').trim()||'Sem identificação'}</b>${cur.edificioId&&edName(cur.edificioId)?html`<span>Edifício: ${edName(cur.edificioId)}</span>`:null}</div></div>
          <div className="row"><div><label className="lbl">Identificação interna</label><input className="inp" maxLength="60" placeholder="Ex.: Lilás — Apto 302 Garden" value=${cur.nome} onInput=${e=>{const v=e.target.value;setCur(c=>({...c,nome:v}))}}/></div>
            <div><label className="lbl">Edifício</label><select className="inp" value=${cur.edificioId} onChange=${e=>{const id=e.target.value;setCur(c=>({...c,edificioId:id}));const b=lib.edificios.find(x=>x.id===id);if(b)setInfo(s=>({...s,subtitle:s.subtitle||b.nome,bairro:s.bairro||b.bairro||'',cidade:s.cidade||b.cidade||''}))}}><option value="">— Nenhum —</option>${lib.edificios.map(b=>html`<option key=${b.id} value=${b.id}>${b.nome}</option>`)}</select></div></div>
          <label className="lbl">Status</label>
          <div className="seg">${Object.entries(STATUS).map(([k,v])=>html`<button key=${k} className=${(cur.status||'disponivel')===k?'on':''} onClick=${()=>{setCur(c=>({...c,status:k}));if(cur.id){const d=lib.imoveis.find(x=>x.id===cur.id);if(d)setStatusOf(d,k)}}}>${v.l}</button>`)}</div>
          <div className="libbar">
            <button className="btn light" onClick=${()=>saveImovel(false)}>${cur.id?'Salvar alterações':'Salvar imóvel'}</button>
            ${cur.id&&html`<button className="btn light" onClick=${()=>saveImovel(true)}>Salvar como novo</button>`}
            <button className="btn light" onClick=${()=>{setLibTab('imoveis');setLibOpen(true)}}>Abrir biblioteca (${lib.imoveis.length})</button>
          </div>
          <div className="hint">${capInfo.cloud?'Salva dados, fotos (com enquadramento e legendas) e a configuração da arte na sua conta. Cadastre os edifícios para começar cada novo imóvel já com nome, bairro, cidade e fotos.':capInfo.checked?'Sem conta do Claude: imóveis, edifícios e fotos ficam salvos neste aparelho/navegador. Para levar a outro aparelho, use Exportar/Importar backup na biblioteca.':'Conectando à sua conta…'}</div>
        <//>
        <${Section} n="I" title="Peça, modelo e formato" open=${open.m} onToggle=${tog('m')}>
          <label className="lbl" style=${{marginTop:4}}>Tipo de peça</label>
          <div className="seg"><button className=${piece==='single'?'on':''} onClick=${()=>{setPiece('single');setSlideIdx(0)}}>Post único</button><button className=${piece==='carousel'?'on':''} onClick=${()=>{setPiece('carousel');setSlideIdx(0)}}>Carrossel</button></div>
          ${piece==='carousel'&&html`<div style=${{marginTop:10,padding:'8px 10px',border:'1px solid var(--line)',background:'#FBF7EE'}}>
            <label className="chk"><input type="checkbox" checked=${car.photos} onChange=${e=>setCar(c=>({...c,photos:e.target.checked}))}/>Slides com as demais fotos (uma por slide)</label>
            <label className="chk"><input type="checkbox" checked=${car.ficha} onChange=${e=>setCar(c=>({...c,ficha:e.target.checked}))}/>Ficha técnica no último slide</label>
            <label className="chk"><input type="checkbox" checked=${car.cue} onChange=${e=>setCar(c=>({...c,cue:e.target.checked}))}/>Indicador “deslize ›››” na capa</label>
            <div style=${{display:'flex',alignItems:'center',gap:8,margin:'8px 0 4px'}}><button className="ib" disabled=${sIdx===0} onClick=${()=>setSlideIdx(sIdx-1)}>‹</button><span style=${{fontSize:11,fontWeight:700,letterSpacing:'.12em',color:'var(--emerald)'}}>EDITANDO O SLIDE ${sIdx+1} DE ${slides.length}</span><button className="ib" disabled=${sIdx>=slides.length-1} onClick=${()=>setSlideIdx(sIdx+1)}>›</button><button className="btn ghost" style=${{marginLeft:'auto'}} onClick=${()=>setMtab('prev')}>Ver prévia</button></div>
            <div className="hint" style=${{marginTop:2}}>${slides.length} slide${slides.length>1?'s':''}: capa${car.photos?`, ${slides.filter(x=>x.type==='photo').length} de fotos`:''}${car.ficha?', ficha técnica':''}. Escolha as fotos e legendas em “Fotografias”.${slides.length>20?' Atenção: o Instagram aceita no máximo 20 imagens.':''}</div></div>`}
          <label className="lbl">Modelo da capa</label>
          <div className="tpls">${TEMPLATES.map(t=>html`<button key=${t.id} className=${'tpl'+(tpl===t.id?' on':'')} onClick=${()=>setTpl(t.id)}><${TplMini} id=${t.id}/><b>MODELO ${t.id}</b><small>${t.name}</small></button>`)}</div>
          <label className="lbl">Formato de exportação</label>
          <div className="seg">${Object.entries(FORMATS).map(([k,v])=>html`<button key=${k} className=${fmt===k?'on':''} onClick=${()=>setFmt(k)}>${v.label}<br/><small style=${{fontWeight:500,letterSpacing:'.04em',opacity:.8}}>${v.w}×${v.h}</small></button>`)}</div>
          ${fmt==='story'&&html`<div className="hint">Stories: textos e logo ficam fora das faixas cobertas pela interface do Instagram (linhas tracejadas, visíveis só na prévia).</div>`}
          <label className="lbl">Divisão foto / informações<span style=${{marginLeft:'auto',letterSpacing:'.08em',color:'var(--emerald)'}}>${split?'Manual':'Automática'} · foto ${Math.round((split||autoSplit)*100)}%</span></label>
          <div className="rng" style=${{gridTemplateColumns:'1fr 96px'}}><input type="range" min="0.4" max="0.9" step="0.005" value=${split||autoSplit||.7} onInput=${e=>setSplit(+e.target.value)}/><button className="btn ghost" disabled=${!split} onClick=${()=>setSplit(null)}>Automático</button></div>
          <div className="hint" style=${{marginTop:0}}>Suba ou desça a linha aqui, ou arraste a alça dourada (↕) direto na prévia. Os textos se ajustam ao espaço que sobra. Cada modelo e formato guarda a sua posição.</div>
        <//>
        <${Section} n="II" title="Fotografias" open=${open.f} onToggle=${tog('f')}>
          <label className=${'drop'+(over==='ph'?' over':'')} onDragOver=${e=>{e.preventDefault();setOver('ph')}} onDragLeave=${()=>setOver(null)} onDrop=${e=>{e.preventDefault();setOver(null);addPhotos(e.dataTransfer.files)}}>
            <b>Enviar fotografias</b>Toque para escolher ou arraste aqui · JPG, PNG, WEBP
            <input type="file" accept="image/*" multiple hidden onChange=${e=>{addPhotos(e.target.files);e.target.value=''}}/>
          </label>
          ${photos.length>0&&html`<div className="photos">${photos.map((p,i)=>html`
            <div key=${p.id} className=${'ph'+(p.id===selId?' sel':'')} onClick=${()=>setSelId(p.id)} draggable="true"
              onDragStart=${()=>{dragIdx.current=i}} onDragOver=${e=>e.preventDefault()} onDrop=${e=>{e.preventDefault();e.stopPropagation();reorderTo(dragIdx.current,i);dragIdx.current=null}}>
              <img src=${p.url} alt=""/>
              <div className="meta"><div>${p.name}</div>
                ${i===0?html`<span className="tag">PRINCIPAL</span>`:i<usedCount?html`<span className="tag alt">NA CAPA · ${i+1}</span>`:html`<span className="tag alt">${p.w}×${p.h}</span>`}
                ${piece==='carousel'&&inCar(p,i)&&car.photos&&html`<span className="tag alt" style=${{marginLeft:4}}>SLIDE ${(slides.find(x=>x.pid===p.id)||{}).index||''}</span>`}</div>
              ${i>0&&html`<button className="ib" title="Definir como principal" onClick=${e=>{e.stopPropagation();makeMain(i)}}>★</button>`}
              <button className="ib" title="Subir" disabled=${i===0} onClick=${e=>{e.stopPropagation();move(i,-1)}}>↑</button>
              <button className="ib" title="Descer" disabled=${i===photos.length-1} onClick=${e=>{e.stopPropagation();move(i,1)}}>↓</button>
              <button className="ib" title="Remover" onClick=${e=>{e.stopPropagation();removePhoto(p.id)}}>✕</button>
            </div>`)}</div>`}
          ${tpl==='C'&&photos.length>0&&photos.length<3&&html`<div className="hint">O modelo Galeria usa até 3 fotos. Com ${photos.length} foto${photos.length>1?'s':''}, o layout se ajusta automaticamente.</div>`}
          ${sel&&html`<div className="frame">
            <label className="lbl" style=${{marginTop:0}}>Enquadramento · ${sel.name}</label>
            <div className="rng"><span>Zoom</span><input type="range" min="0.4" max="3" step="0.01" value=${sel.frame.z} onInput=${e=>setFrame(sel.id,{z:+e.target.value})}/><span>${Math.round(sel.frame.z*100)}%</span></div>
            <div className="rng"><span>Horizontal</span><input type="range" min="-1" max="1" step="0.005" value=${sel.frame.x} onInput=${e=>setFrame(sel.id,{x:+e.target.value})}/><span>${Math.round(sel.frame.x*100)}</span></div>
            <div className="rng"><span>Vertical</span><input type="range" min="-1" max="1" step="0.005" value=${sel.frame.y} onInput=${e=>setFrame(sel.id,{y:+e.target.value})}/><span>${Math.round(sel.frame.y*100)}</span></div>
            <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}><span className="hint" style=${{margin:0}}>Arraste a foto na prévia. Abaixo de 100% a foto inteira aparece menor, com as bordas se dissolvendo no verde.</span><button className="btn ghost" onClick=${()=>setFrame(sel.id,{z:1,x:0,y:0})}>Centralizar</button></div>
            <div className="hint">A foto é apenas recortada e posicionada. Os degradês ficam por cima, nas bordas — o imóvel não é alterado.</div>
            ${piece==='carousel'&&html`<div style=${{borderTop:'1px solid var(--line)',marginTop:10,paddingTop:4}}>
              <label className="chk"><input type="checkbox" checked=${inCar(sel,photos.indexOf(sel))} onChange=${e=>setPhotos(ps=>ps.map(q=>q.id===sel.id?{...q,car:e.target.checked}:q))}/>Ter um slide próprio no carrossel</label>
              <label className="lbl" style=${{marginTop:6}}>Legenda do slide (opcional)</label>
              <input className="inp" maxLength="60" placeholder="Ex.: Living integrado à varanda" value=${sel.caption||''} onInput=${e=>{const v=e.target.value;setPhotos(ps=>ps.map(q=>q.id===sel.id?{...q,caption:v}:q))}}/>
              ${(()=>{const sl=slides.find(x=>x.pid===sel.id);return sl?html`<button className="btn ghost" style=${{marginTop:6}} onClick=${()=>{setSlideIdx(sl.index-1);setMtab('prev')}}>Ver slide ${sl.index}</button>`:null})()}
            </div>`}
          </div>`}
        <//>
        <${Section} n="III" title="Título e chamada" open=${open.i} onToggle=${tog('i')}>
          <label className="lbl">Frase principal (título)</label>
          <textarea className="inp" rows="2" maxLength="90" placeholder="Ex.: Apartamento Garden no Ahú" value=${info.headline} onInput=${e=>setI('headline',e.target.value)}></textarea>
          <label className="lbl">Subtítulo · nome do empreendimento</label>
          <input className="inp" maxLength="40" placeholder="Ex.: Edifício Lilás" value=${info.subtitle} onInput=${e=>setI('subtitle',e.target.value)}/>
          <label className="lbl">Faixa dourada de chamada<label className="tgl"><input type="checkbox" checked=${info.chamadaOn} onChange=${e=>setI('chamadaOn',e.target.checked)}/>Exibir</label></label>
          <input className="inp" maxLength="32" placeholder="Ex.: Pronto para morar" value=${info.chamada} disabled=${!info.chamadaOn} onInput=${e=>setI('chamada',e.target.value)}/>
          <div className="chips">${CALLS.map(c=>html`<button key=${c} className=${'chip'+(up(info.chamada)===c?' on':'')} onClick=${()=>setInfo(s=>({...s,chamada:c,chamadaOn:true}))}>${c}</button>`)}</div>
        <//>
        <${Section} n="IV" title="Informações do imóvel" open=${open.c} onToggle=${tog('c')}>
          <div className="row"><div><label className="lbl">Bairro</label><input className="inp" value=${info.bairro} onInput=${e=>setI('bairro',e.target.value)}/></div>
          <div><label className="lbl">Cidade</label><input className="inp" value=${info.cidade} onInput=${e=>setI('cidade',e.target.value)}/></div></div>
          <div className="row5">
            <div><label className="lbl">Área m²</label><input className="inp" inputMode="decimal" placeholder="144,96" value=${info.area} onInput=${e=>{let v=e.target.value.replace(/\./g,',').replace(/[^\d,]/g,'');const p=v.split(',');v=p[0].slice(0,6)+(p.length>1?','+p.slice(1).join('').slice(0,2):'');setI('area',v)}}/></div>
            ${[['quartos','Dormit.'],['suites','Suítes'],['banheiros','Banhs.'],['vagas','Vagas']].map(([k,l])=>html`<div key=${k}><label className="lbl">${l}</label><input className="inp" inputMode="numeric" value=${info[k]} onInput=${e=>setI(k,digits(e.target.value,2))}/></div>`)}
          </div>
          <label className="lbl">Preço de venda (R$)</label>
          <input className="inp" inputMode="numeric" placeholder="Opcional · ex.: 1.890.000" value=${priceDisplay} onInput=${e=>setI('preco',digits(e.target.value,12))}/>
          <label className="lbl">Característica especial</label>
          <input className="inp" maxLength="48" placeholder="Ex.: Terraço descoberto com churrasqueira" value=${info.feature} onInput=${e=>setI('feature',e.target.value)}/>
          <div className="chips">${FEATURES.map(([t,ic])=>html`<button key=${t} className=${'chip'+(info.feature===t?' on':'')} onClick=${()=>setInfo(s=>({...s,feature:t,featureIcon:ic}))}>${t}</button>`)}</div>
          <label className="lbl">Ícone da característica</label>
          <div className="icons">${FEATURE_ICONS.map(([k])=>html`<${IconBtn} key=${k} type=${k} P=${P} on=${info.featureIcon===k} onClick=${()=>setI('featureIcon',k)}/>`)}</div>
          <div className="hint">Todos os campos são opcionais: o que ficar em branco não aparece, e a composição se reorganiza sozinha.</div>
          <label className="lbl" style=${{marginTop:18,color:'var(--emerald)'}}>Ficha técnica do carrossel</label>
          <label className="lbl">Chamada final (faixa dourada)</label>
          <input className="inp" maxLength="30" placeholder="Ex.: Agende sua visita" value=${info.cta} onInput=${e=>setI('cta',e.target.value)}/>
          <div className="chips">${CTAS.map(c=>html`<button key=${c} className=${'chip'+(up(info.cta)===c?' on':'')} onClick=${()=>setI('cta',c)}>${c}</button>`)}</div>
          <label className="lbl">Contato</label>
          <input className="inp" maxLength="70" placeholder="Ex.: (41) 99999-9999 · @quorumimoveis · CRECI J 0000" value=${info.contato} onInput=${e=>setI('contato',e.target.value)}/>
        <//>
        <${Section} n="V" title="Identidade da marca" open=${open.b} onToggle=${tog('b')}>
          <div className=${'logoBox'+(mode==='plate'?' plate':'')} style=${useKey?{backgroundImage:'repeating-conic-gradient(#1A3B2F 0 25%,#123026 0 50%)',backgroundSize:'16px 16px'}:null}>${logo?html`<img src=${logo.url} alt="Logo Quorum"/>`:html`<span>Nenhuma logo carregada ainda.</span>`}</div>
          <label className=${'drop'+(over==='lg'?' over':'')} style=${{marginTop:8}} onDragOver=${e=>{e.preventDefault();setOver('lg')}} onDragLeave=${()=>setOver(null)} onDrop=${e=>{e.preventDefault();setOver(null);onLogo(e.dataTransfer.files[0])}}>
            <b>${logo?'Substituir logo':'Carregar logo original'}</b>De preferência PNG transparente ou SVG · cores e proporções nunca são alteradas
            <input type="file" accept="image/png,image/svg+xml,image/jpeg,image/webp" hidden onChange=${e=>{onLogo(e.target.files[0]);e.target.value=''}}/>
          </label>
          ${logoInfo.opaqueBg&&html`<div style=${{marginTop:12,padding:10,border:'1px solid var(--line)',background:'#FBF7EE'}}>
            <label className="lbl" style=${{margin:0}}>Remover fundo da logo<label className="tgl"><input type="checkbox" checked=${useKey} disabled=${!logoKeyed} onChange=${e=>{setKeyBg(e.target.checked);if(e.target.checked)setLogoMode('glow')}}/>${useKey?'Ativado':'Desativado'}</label></label>
            <div className="hint">Sua logo foi enviada com fundo (sem transparência). A remoção tira só o fundo, para a logo ficar solta sobre o degradê verde — letras, cores e proporções continuam idênticas. Atenção: partes da logo com cor parecida com a do fundo (como o painel verde do símbolo) podem sumir junto. Para um resultado perfeito, use o PNG transparente original da marca.</div></div>`}
          <label className="lbl">Aplicação da logo</label>
          <div className="seg"><button className=${mode==='glow'?'on':''} onClick=${()=>setLogoMode('glow')}>Sobre o fundo · halo</button><button className=${mode==='none'?'on':''} onClick=${()=>setLogoMode('none')}>Só a logo</button><button className=${mode==='plate'?'on':''} onClick=${()=>setLogoMode('plate')}>Placa champagne</button></div>
          <div className="hint">“Só a logo” aplica a logo pura, sem halo nem placa — funciona melhor quando a área da foto atrás dela é escura ou uniforme. Use “Sobre o fundo” com a versão clara/dourada da logo (como na referência). Se a sua logo tem letras verdes ou fundo próprio, use “Placa champagne” para manter a legibilidade — a logo nunca tem as cores alteradas.${logo&&!logoMode?(useKey?' O fundo da sua logo foi removido automaticamente, então ela vai direto sobre o halo.':(logoInfo.dark||logoInfo.opaqueBg?' Detectamos uma logo escura: a placa foi aplicada automaticamente.':'')):''}</div>
          <label className="lbl">Tamanho e posição da logo<span style=${{marginLeft:'auto',letterSpacing:'.08em',color:'var(--emerald)'}}>${FORMATS[fmt].label}</span></label>
          <div className="frame" style=${{marginTop:0}}>
            <div className="rng"><span>Tamanho</span><input type="range" min="0.5" max="1.8" step="0.01" value=${la.s} onInput=${e=>setLA({s:+e.target.value})}/><span>${Math.round(la.s*100)}%</span></div>
            <div className="rng"><span>Horizontal</span><input type="range" min="-250" max="800" step="1" value=${la.x} onInput=${e=>setLA({x:+e.target.value})}/><span>${la.x}</span></div>
            <div className="rng"><span>Vertical</span><input type="range" min="-150" max="1500" step="1" value=${la.y} onInput=${e=>setLA({y:+e.target.value})}/><span>${la.y}</span></div>
            <div className="rng" style=${{opacity:mode==='glow'?1:.45}}><span>Opacidade do halo</span><input type="range" min="0" max="1" step="0.01" disabled=${mode!=='glow'} value=${la.h} onInput=${e=>setLA({h:+e.target.value})}/><span>${Math.round(la.h*100)}%</span></div>
            <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}><span className="hint" style=${{margin:0}}>Dica: arraste a logo direto na prévia. Cada formato guarda o seu ajuste; o halo acompanha a logo.</span><button className="btn ghost" onClick=${()=>setLogoAdjs(o=>({...o,[fmt]:{...DEFAULT_LA}}))}>Restaurar padrão</button></div>
          </div>
          <label className="lbl">Paleta</label>
          <div className="sw">${[['deep','Preto esverdeado'],['emerald','Verde esmeralda'],['gold','Dourado'],['champagne','Champagne']].map(([k,l])=>html`<label key=${k} className="swc"><input type="color" value=${colors[k]} onInput=${e=>setColors(c=>({...c,[k]:e.target.value.toUpperCase()}))}/><span>${l}<br/><small style=${{fontWeight:500,letterSpacing:0}}>${colors[k]}</small></span></label>`)}</div>
          ${logoInfo.colors.length>0&&html`<div><label className="lbl">Cores extraídas da logo</label><div className="ext">${logoInfo.colors.map(h=>html`<div key=${h} className="extc"><i style=${{background:h}} title=${h}></i><div><button onClick=${()=>setColors(c=>({...c,gold:h}))}>Ouro</button><button onClick=${()=>setColors(c=>({...c,emerald:h}))}>Verde</button></div></div>`)}</div></div>`}
          <div style=${{display:'flex',gap:8,marginTop:14,alignItems:'center',flexWrap:'wrap'}}>
            <button className="btn light" onClick=${saveBrand}>Salvar identidade</button>
            <button className="btn ghost" onClick=${()=>setColors({...DEFAULT_COLORS})}>Restaurar paleta</button>
          </div>
          <div className="status">${saveState==='cloud'?html`<span className="ok">✓ Salva na sua conta — logo, paleta, aplicação e modelo padrão voltam em qualquer sessão.</span>`:saveState==='local'?html`<span className="ok">✓ Salva neste navegador.</span>`:saveState==='saving'?'Salvando…':capInfo.cloud?'Salva logo, paleta e modelo/formato preferidos na sua conta.':'Salva logo, paleta e modelo preferido neste navegador.'}</div>
        <//>
      </aside>
      <section className="previewWrap">
        ${piece==='carousel'&&html`<div className="snav">
          <button className="big" disabled=${sIdx===0} onClick=${()=>setSlideIdx(sIdx-1)}>‹ Anterior</button>
          <div className="mid"><span>Slide ${sIdx+1} de ${slides.length}</span><span style=${{fontWeight:500,opacity:.75,letterSpacing:'.1em'}}>${slides[sIdx].type==='cover'?'Capa':slides[sIdx].type==='ficha'?'Ficha técnica':'Foto'}</span>
            <div className="dots">${slides.map((x,j)=>html`<i key=${j} className=${j===sIdx?'on':''} onClick=${()=>setSlideIdx(j)}></i>`)}</div></div>
          <button className="big" disabled=${sIdx>=slides.length-1} onClick=${()=>setSlideIdx(sIdx+1)}>Próximo ›</button></div>`}
        <div className="stage" style=${{'--ar':F.ar,'--arn':F.arn}}>
          <canvas ref=${canvasRef} className=${dragging?'dragging':''} onPointerDown=${onDown} onPointerMove=${onMove} onPointerUp=${onUp} onPointerCancel=${onUp}></canvas>
        </div>
        ${piece==='carousel'&&html`<div className="strip">
          <button className="ar" disabled=${sIdx===0} onClick=${()=>setSlideIdx(sIdx-1)}>‹</button>
          <div className="thumbs">${slides.map((sl,j)=>html`<button key=${j} className=${'thumb'+(j===sIdx?' on':'')} onClick=${()=>setSlideIdx(j)} title=${sl.type==='cover'?'Capa':sl.type==='ficha'?'Ficha técnica':'Foto'}>
            ${thumbs[j]?html`<img src=${thumbs[j]} alt=""/>`:html`<div className="ph0" style=${{aspectRatio:F.ar}}>…</div>`}<span>${sl.index}</span></button>`)}</div>
          <button className="ar" disabled=${sIdx>=slides.length-1} onClick=${()=>setSlideIdx(sIdx+1)}>›</button></div>`}
        <div className="pvInfo"><span>${piece==='carousel'?`Slide ${sIdx+1}/${slides.length} · ${slides[sIdx].type==='cover'?'Capa · Modelo '+tpl:slides[sIdx].type==='ficha'?'Ficha técnica':'Foto'}`:`Modelo ${tpl} · ${TEMPLATES.find(t=>t.id===tpl).name}`}</span><i className="dot"></i><span>${F.w} × ${F.h} px</span><i className="dot"></i><span>PNG</span>
          ${warn.length>0&&html`<span className="warn">· ${warn[0]}</span>`}</div>
      </section>
    </main>
    ${confirmClear&&html`<div className="modalBg" onClick=${()=>setConfirmClear(false)}><div className="modal" onClick=${e=>e.stopPropagation()}>
      <h4>Limpar formulário?</h4><p>Remove as fotografias, o título, a chamada e as informações do imóvel. A logo e a paleta permanecem.</p>
      <div className="mrow"><button className="btn light" onClick=${()=>setConfirmClear(false)}>Cancelar</button><button className="btn solid" onClick=${doClear}>Limpar</button></div></div></div>`}
    ${modal&&html`<div className="modalBg" onClick=${()=>setModal(null)}><div className="modal" onClick=${e=>e.stopPropagation()}>
      <h4>${modal.items.length>1?`Carrossel gerado · ${modal.items.length} imagens`:'Publicação gerada'}</h4><p>${F.w} × ${F.h} px · PNG</p>
      ${modal.fallback&&html`<div style=${{padding:10,border:'1px solid #E3C88C',background:'#FBF5E8',fontSize:12,lineHeight:1.5,marginBottom:12}}><b>${modal.code==='sem-permissao'?'Neste aparelho o Claude não está logado, por isso o botão de baixar não funciona aqui.':`O download direto não funcionou${modal.code?` (código: ${modal.code})`:''}.`}</b><br/>Para salvar mesmo assim: <b>pressione e segure a imagem</b> e escolha “Salvar na Fotos” (no computador: botão direito → “Salvar imagem”). Ou toque em “Tentar de novo”.</div>`}
      ${modal.items.length>1?html`<div className="gal">${modal.items.map((it,j)=>html`<figure key=${j}><img src=${it.url} alt=""/><figcaption><span>${String(j+1).padStart(2,'0')}</span>${!modal.fallback?html`<button onClick=${()=>download(it)}>BAIXAR</button>`:html`<button onClick=${()=>copyImg(it)}>COPIAR</button>`}</figcaption></figure>`)}</div>`:html`<img className="out" src=${modal.items[0].url} alt="Publicação gerada"/>`}
      <div className="mrow"><button className="btn light" onClick=${()=>setModal(null)}>Fechar</button>${modal.fallback&&modal.items.length===1&&html`<button className="btn light" onClick=${()=>copyImg(modal.items[0])}>Copiar imagem</button>`}${modal.fallback&&modal.items.length===1&&modal.code!=='sem-permissao'&&html`<button className="btn solid" onClick=${()=>{const it=modal.items[0];setModal(null);setTimeout(()=>download(it),200)}}>Tentar de novo</button>`}${!modal.fallback&&(modal.items.length>1?html`<button className="btn solid" onClick=${()=>downloadAll(modal.items)}>Baixar tudo (.zip)</button>`:html`<button className="btn solid" onClick=${()=>download(modal.items[0])}>Baixar PNG</button>`)}</div></div></div>`}
    ${libOpen&&html`<div className="modalBg" onClick=${()=>setLibOpen(false)}><div className="modal wide" onClick=${e=>e.stopPropagation()}>
      <div style=${{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}><h4 style=${{margin:0}}>Biblioteca</h4><input className="inp" style=${{maxWidth:260,marginLeft:'auto'}} placeholder="Buscar por nome, edifício ou bairro" value=${libQ} onInput=${e=>setLibQ(e.target.value)}/></div>
      <div className="ltabs"><button className=${libTab==='imoveis'?'on':''} onClick=${()=>setLibTab('imoveis')}>Imóveis (${lib.imoveis.length})</button><button className=${libTab==='edificios'?'on':''} onClick=${()=>setLibTab('edificios')}>Edifícios (${lib.edificios.length})</button></div>
      ${!lib.ready?html`<div className="empty">Carregando…</div>`:libTab==='imoveis'?html`
        <div className="libbar" style=${{marginTop:0,marginBottom:12}}><button className="btn light" onClick=${newBlank}>+ Novo imóvel em branco</button>${lib.edificios.length>0&&html`<span className="hint" style=${{margin:'auto 0'}}>ou crie a partir de um edifício na aba Edifícios</span>`}</div>
        <div className="chips" style=${{margin:'0 0 12px'}}>${[['all','Todos'],...Object.entries(STATUS).map(([k,v])=>[k,v.l])].map(([k,l])=>html`<button key=${k} className=${'chip'+(libStatus===k?' on':'')} onClick=${()=>setLibStatus(k)}>${l} (${k==='all'?lib.imoveis.length:lib.imoveis.filter(d=>(d.status||'disponivel')===k).length})</button>`)}</div>
        ${fImoveis.length?html`<div className="lgrid">${fImoveis.map(d=>{const S=STATUS[d.status||'disponivel'];return html`<div key=${d.id} className="lcard" style=${d.status==='vendido'?{opacity:.72}:null}>
          <div className="th" style=${d.thumb?{backgroundImage:`url(${d.thumb})`,aspectRatio:'4/5'}:{aspectRatio:'4/5'}}>${d.layout&&d.layout.piece==='carousel'?html`<em>CARROSSEL</em>`:null}<em style=${{left:'auto',right:8,top:8,bottom:'auto',background:S.c,color:'#fff'}}>${S.l.toUpperCase()}</em></div>
          <div className="bd"><b>${d.nome}</b><span>${[edName(d.edificioId),d.info&&d.info.bairro].filter(Boolean).join(' · ')||'—'}</span><span>${(d.photos||[]).length} foto(s) · atualizado ${fmtDate(d.updatedAt)}</span></div>
          <div className="ac"><button className="pri" onClick=${()=>openImovel(d)}>ABRIR</button><select style=${{fontSize:10,fontWeight:700,border:'1px solid var(--line)',background:'#fff',color:S.c,padding:'4px'}} value=${d.status||'disponivel'} onChange=${e=>setStatusOf(d,e.target.value)}>${Object.entries(STATUS).map(([k,v])=>html`<option key=${k} value=${k}>${v.l}</option>`)}</select><button className="del" onClick=${()=>setConfirmDel({kind:'imoveis',id:d.id,nome:d.nome})}>EXCLUIR</button></div></div>`})}</div>`
        :html`<div className="empty">${q||libStatus!=='all'?'Nada encontrado com esse filtro.':'Nenhum imóvel salvo ainda. Monte uma arte e use “Salvar imóvel”.'}</div>`}`
      :html`
        <div className="libbar" style=${{marginTop:0,marginBottom:12}}><button className="btn light" onClick=${()=>setBForm({id:null,nome:'',bairro:'',cidade:'',feature:'',featureIcon:'estrela',photos:[]})}>+ Cadastrar edifício</button></div>
        ${fEdificios.length?html`<div className="lgrid">${fEdificios.map(b=>html`<div key=${b.id} className="lcard">
          <div className="th" style=${b.thumb?{backgroundImage:`url(${b.thumb})`}:b.photos&&b.photos[0]&&!isLocalId(b.photos[0].assetId)?{backgroundImage:`url(/_blob/${b.photos[0].assetId})`}:null}></div>
          <div className="bd"><b>${b.nome}</b><span>${[b.bairro,b.cidade].filter(Boolean).join(' · ')||'—'}</span><span>${(b.photos||[]).length} foto(s) · ${lib.imoveis.filter(d=>d.edificioId===b.id).length} imóvel(is)</span></div>
          <div className="ac"><button className="pri" onClick=${()=>newFromEdificio(b)}>NOVO IMÓVEL AQUI</button><button onClick=${()=>editEdificio(b)}>EDITAR</button><button className="del" onClick=${()=>setConfirmDel({kind:'edificios',id:b.id,nome:b.nome})}>EXCLUIR</button></div></div>`)}</div>`
        :html`<div className="empty">${q?'Nada encontrado.':'Nenhum edifício cadastrado. Cadastre com nome, bairro, cidade e as fotos da fachada e áreas comuns.'}</div>`}`}
      <div className="mrow" style=${{marginTop:14,justifyContent:'space-between'}}>
        <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}><button className="btn light" onClick=${exportLib}>Exportar backup (.zip)</button>
          <label className="btn light" style=${{display:'inline-block'}}>Importar backup<input type="file" accept=".zip,application/zip" hidden onChange=${e=>{importLib(e.target.files[0]);e.target.value=''}}/></label></div>
        <button className="btn light" onClick=${()=>setLibOpen(false)}>Fechar</button></div>
      <div className="hint">O backup é um arquivo .zip com todos os edifícios, imóveis e fotos. Importar adiciona os cadastros do arquivo à biblioteca (não apaga nada).</div></div></div>`}
    ${bForm&&html`<div className="modalBg" onClick=${()=>setBForm(null)}><div className="modal wide" onClick=${e=>e.stopPropagation()}>
      <h4>${bForm.id?'Editar edifício':'Cadastrar edifício'}</h4><p>Esses dados e fotos entram automaticamente em cada novo imóvel criado neste edifício.</p>
      <label className="lbl">Nome do edifício</label><input className="inp" maxLength="40" placeholder="Ex.: Edifício Lilás" value=${bForm.nome} onInput=${e=>{const v=e.target.value;setBForm(x=>({...x,nome:v}))}}/>
      <div className="row"><div><label className="lbl">Bairro</label><input className="inp" value=${bForm.bairro} onInput=${e=>{const v=e.target.value;setBForm(x=>({...x,bairro:v}))}}/></div><div><label className="lbl">Cidade</label><input className="inp" value=${bForm.cidade} onInput=${e=>{const v=e.target.value;setBForm(x=>({...x,cidade:v}))}}/></div></div>
      <label className="lbl">Característica do edifício (opcional)</label><input className="inp" maxLength="48" placeholder="Ex.: Rooftop com piscina" value=${bForm.feature} onInput=${e=>{const v=e.target.value;setBForm(x=>({...x,feature:v}))}}/>
      <label className="lbl">Fotos do edifício (fachada, áreas comuns)</label>
      <label className="drop"><b>Adicionar fotos</b>Toque para escolher · a primeira é a capa do edifício<input type="file" accept="image/*" multiple hidden onChange=${e=>{addBPhotos(e.target.files);e.target.value=''}}/></label>
      ${bForm.photos.length>0&&html`<div className="bph">${bForm.photos.map((p,j)=>html`<div key=${p.id}><img src=${p.url} alt=""/><button title="Remover" onClick=${()=>setBForm(x=>({...x,photos:x.photos.filter(q=>q.id!==p.id)}))}>✕</button>
        <input placeholder="Legenda (opcional)" value=${p.caption||''} onInput=${e=>{const v=e.target.value;setBForm(x=>({...x,photos:x.photos.map(q=>q.id===p.id?{...q,caption:v}:q)}))}}/></div>`)}</div>`}
      ${!capInfo.cloud&&capInfo.checked&&html`<div className="hint">Sem conta do Claude: o edifício e as fotos ficam salvos neste aparelho/navegador.</div>`}
      <div className="mrow" style=${{marginTop:14}}><button className="btn light" onClick=${()=>setBForm(null)}>Cancelar</button><button className="btn solid" onClick=${saveEdificio}>${busy||'Salvar edifício'}</button></div></div></div>`}
    ${confirmDel&&html`<div className="modalBg" onClick=${()=>setConfirmDel(null)}><div className="modal" onClick=${e=>e.stopPropagation()}>
      <h4>Excluir “${confirmDel.nome}”?</h4><p>${confirmDel.kind==='edificios'?'O edifício sai da biblioteca. Os imóveis já salvos nele continuam existindo.':'O imóvel sai da biblioteca. Isso não pode ser desfeito.'}</p>
      <div className="mrow"><button className="btn light" onClick=${()=>setConfirmDel(null)}>Cancelar</button><button className="btn solid" onClick=${doDelete}>Excluir</button></div></div></div>`}
    ${busy&&html`<div className="toast">${busy}</div>`}
    ${toast&&!busy&&html`<div className="toast">${toast}</div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
</body>
</html>
